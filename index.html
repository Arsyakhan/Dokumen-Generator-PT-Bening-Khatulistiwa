<script>
    // URL GOOGLE APPS SCRIPT YANG SUDAH DIPISAH
    const SCRIPT_URL_COMM = 'https://script.google.com/macros/s/AKfycbw8azLna99rmPfnO9AnclachEPS0kqP7RwjST2Yy-LHnqO3-lAxsr3WrJNFyXn0Y6juUA/exec';
    const SCRIPT_URL_HO = 'https://script.google.com/macros/s/AKfycbzl5BCNuC1gFQWxkccja6HK3k4tADdXNDdF0S17YzqkqfFRRDuReD-eMWSVuZuX_7MR/exec';

    // NAVIGASI TAB
    function switchTab(tab) {
        const btnComm = document.getElementById('tabBtnComm');
        const btnHO = document.getElementById('tabBtnHO');
        const tabComm = document.getElementById('tabCommissioning');
        const tabHO = document.getElementById('tabHandOver');

        if (tab === 'commissioning') {
            btnComm.className = 'tab-btn active-comm';
            btnHO.className = 'tab-btn';
            tabComm.className = 'tab-content active';
            tabHO.className = 'tab-content';
        } else {
            btnHO.className = 'tab-btn active-ho';
            btnComm.className = 'tab-btn';
            tabHO.className = 'tab-content active';
            tabComm.className = 'tab-content';
        }
    }

    // DINAMISASI FORM COMMISSIONING
    function toggleCommPID() {
        const hasSoft = document.getElementById('comm_has_softener').checked;
        const hasUf = document.getElementById('comm_has_uf').checked;
        const hasRo = document.getElementById('comm_has_ro').checked;
        const isRoLarge = document.getElementById('comm_is_ro_large').checked;
        const hasRecycle = document.getElementById('comm_has_recycle').checked;

        document.getElementById('comm_ro_sub').style.display = hasRo ? 'flex' : 'none';
        document.getElementById('comm_pid_card').style.display = (hasSoft || hasUf || hasRo) ? 'block' : 'none';
        document.getElementById('comm_pid_softener').style.display = hasSoft ? 'block' : 'none';
        document.getElementById('comm_pid_uf').style.display = hasUf ? 'block' : 'none';
        document.getElementById('comm_pid_ro').style.display = hasRo ? 'block' : 'none';
        document.getElementById('comm_wrap_pi_06').style.display = isRoLarge ? 'flex' : 'none';
        document.getElementById('comm_wrap_fi_03').style.display = hasRecycle ? 'flex' : 'none';
    }

    function buildCommChecklist() {
        let list = [
            "( ) Power supply to electrical panel properly installed.",
            "( ) Power supply properly joined to electrical Control panel.",
            "( ) Water drain nozzle properly joined to water drain line."
        ];
        if (document.getElementById('comm_has_clarifier').checked) list.push("( ) Inlet Transfer pump properly joined to Outlet Settlement Tank / Raw Water Line.");
        if (document.getElementById('comm_has_dosing').checked) { list.push("( ) Chemical Dosing line properly joined to main pipe."); list.push("( ) Dosing pump properly joined to Chemical Tank."); }
        if (document.getElementById('comm_has_birm').checked) { list.push("( ) Inlet Birm Filter properly joined to feed line."); list.push("( ) Outlet Birm Filter properly joined to the next treatment stage."); }
        if (document.getElementById('comm_has_mmf').checked) { list.push("( ) Inlet MMF properly joined to feed line."); list.push("( ) Outlet MMF properly joined to the next treatment stage."); }
        if (document.getElementById('comm_has_acf').checked) { list.push("( ) Inlet ACF properly joined to feed line."); list.push("( ) Outlet ACF properly joined to the next treatment stage."); }
        if (document.getElementById('comm_has_softener').checked) list.push("( ) Softener brine line properly joined to Brine Tank.");
        if (document.getElementById('comm_has_uf').checked) { list.push("( ) Inlet UF Feed Water Pump properly joined to Feed Water Tank."); list.push("( ) Outlet UF properly joined to UF Permeate Tank."); list.push("( ) Outlet cleaning line UF properly joined to UF Cleaning Tank."); list.push("( ) Inlet UF Backwash pump properly joined to UF Product Tank."); }
        if (document.getElementById('comm_has_ro').checked) { list.push("( ) Outlet product line RO properly joined to Product water tank and CIP tank."); list.push("( ) Outlet reject line RO properly joined to water drain line."); list.push("( ) Outlet Cleaning/Flushing Pump properly joined to Inlet Cartridge filter."); }
        if (document.getElementById('comm_has_mixedbed').checked) { list.push("( ) HCl and NaOH chemicals already prepared necessarily."); list.push("( ) Chemical drain nozzle properly joined to chemical drain line."); }
        return list.join("\n");
    }

    function submitCommissioning() {
        if (!document.getElementById('comm_project_name').value || !document.getElementById('comm_system_title').value || !document.getElementById('comm_company_name').value) {
            alert('Mohon isi Project Name, System Title, dan Company Name terlebih dahulu!');
            return;
        }

        const payload = {
            project_name: document.getElementById('comm_project_name').value,
            system_title: document.getElementById('comm_system_title').value,
            company_name: document.getElementById('comm_company_name').value,
            po_number: document.getElementById('comm_po_number').value,
            location: document.getElementById('comm_location').value,
            alamat: document.getElementById('comm_alamat').value,
            owner_company: document.getElementById('comm_owner_company').value,
            owner_name: document.getElementById('comm_owner_name').value,
            contractor_name: document.getElementById('comm_contractor_name').value,

            has_clarifier: document.getElementById('comm_has_clarifier').checked,
            has_dosing: document.getElementById('comm_has_dosing').checked,
            has_birm: document.getElementById('comm_has_birm').checked,
            has_mmf: document.getElementById('comm_has_mmf').checked,
            has_acf: document.getElementById('comm_has_acf').checked,
            has_softener: document.getElementById('comm_has_softener').checked,
            has_uf: document.getElementById('comm_has_uf').checked,
            has_ro: document.getElementById('comm_has_ro').checked,
            is_ro_large: document.getElementById('comm_is_ro_large').checked,
            has_recycle: document.getElementById('comm_has_recycle').checked,
            has_mixedbed: document.getElementById('comm_has_mixedbed').checked,

            tag_pi_soft_in: document.getElementById('comm_tag_pi_soft_in').value,
            tag_pi_soft_out: document.getElementById('comm_tag_pi_soft_out').value,
            tag_ps_uf_feed: document.getElementById('comm_tag_ps_uf_feed').value,
            tag_ps_uf_bw: document.getElementById('comm_tag_ps_uf_bw').value,
            tag_pi_uf_in: document.getElementById('comm_tag_pi_uf_in').value,
            tag_pi_uf_out: document.getElementById('comm_tag_pi_uf_out').value,
            tag_fi_uf: document.getElementById('comm_tag_fi_uf').value,
            tag_pi_01: document.getElementById('comm_tag_pi_01').value,
            tag_pi_02: document.getElementById('comm_tag_pi_02').value,
            tag_pi_03: document.getElementById('comm_tag_pi_03').value,
            tag_pi_04: document.getElementById('comm_tag_pi_04').value,
            tag_pi_05: document.getElementById('comm_tag_pi_05').value,
            tag_pi_06: document.getElementById('comm_tag_pi_06').value,
            tag_fi_01: document.getElementById('comm_tag_fi_01').value,
            tag_fi_02: document.getElementById('comm_tag_fi_02').value,
            tag_fi_03: document.getElementById('comm_tag_fi_03').value,

            checklist_items: buildCommChecklist()
        };

        const btn = document.getElementById('btnComm');
        btn.style.display = 'none';
        document.getElementById('loadingComm').style.display = 'block';

        // MENGGUNAKAN URL COMMISSIONING
        fetch(SCRIPT_URL_COMM, { method: 'POST', body: JSON.stringify(payload) })
        .then(r => r.json())
        .then(res => {
            btn.style.display = 'block';
            document.getElementById('loadingComm').style.display = 'none';
            if (res.status === 'success') {
                document.getElementById('trackComm').style.display = 'block';
                const li = document.createElement('li');
                li.innerHTML = `<span>📋 <strong>${res.fileName}</strong></span><a href="${res.documentUrl}" target="_blank" class="doc-link-comm">Buka Dokumen</a>`;
                document.getElementById('listComm').appendChild(li);
                alert('Dokumen Commissioning Report berhasil disimpan di Drive!');
            } else { alert('Gagal: ' + res.message); }
        })
        .catch(err => {
            btn.style.display = 'block';
            document.getElementById('loadingComm').style.display = 'none';
            alert('Terjadi kesalahan jaringan: ' + err.message);
        });
    }

    // DINAMISASI FORM HAND OVER
    function toggleHOSec() {
        document.getElementById('ho_sec_raw_water').style.display = document.getElementById('ho_has_raw_water').checked ? 'block' : 'none';
        document.getElementById('ho_sec_clarifier').style.display = document.getElementById('ho_has_clarifier').checked ? 'block' : 'none';
        document.getElementById('ho_sec_filtration').style.display = document.getElementById('ho_has_filtration').checked ? 'block' : 'none';
        document.getElementById('ho_sec_softener').style.display = document.getElementById('ho_has_softener').checked ? 'block' : 'none';
        document.getElementById('ho_sec_uf').style.display = document.getElementById('ho_has_uf').checked ? 'block' : 'none';
        document.getElementById('ho_sec_ro').style.display = document.getElementById('ho_has_ro').checked ? 'block' : 'none';
        document.getElementById('ho_sec_cip').style.display = document.getElementById('ho_has_cip').checked ? 'block' : 'none';
        document.getElementById('ho_sec_panel').style.display = document.getElementById('ho_has_panel').checked ? 'block' : 'none';
    }

    function submitHandOver() {
        if (!document.getElementById('ho_project_name').value || !document.getElementById('ho_buyer_company').value) {
            alert('Project Name dan Buyer Company wajib diisi!');
            return;
        }

        const payload = {};
        document.querySelectorAll('#formHO input').forEach(input => {
            const cleanKey = input.id.replace('ho_', '');
            if (input.type === 'checkbox') {
                payload[cleanKey] = input.checked;
            } else {
                payload[cleanKey] = input.value;
            }
        });

        const btn = document.getElementById('btnHO');
        btn.style.display = 'none';
        document.getElementById('loadingHO').style.display = 'block';

        // MENGGUNAKAN URL HAND OVER
        fetch(SCRIPT_URL_HO, { method: 'POST', body: JSON.stringify(payload) })
        .then(r => r.json())
        .then(res => {
            btn.style.display = 'block';
            document.getElementById('loadingHO').style.display = 'none';
            if (res.status === 'success') {
                document.getElementById('trackHO').style.display = 'block';
                const li = document.createElement('li');
                li.innerHTML = `<span>🤝 <strong>${res.fileName}</strong></span><a href="${res.documentUrl}" target="_blank" class="doc-link-ho">Buka Dokumen</a>`;
                document.getElementById('listHO').appendChild(li);
                alert('Dokumen Hand Over berhasil disimpan di Drive!');
            } else { alert('Gagal: ' + res.message); }
        })
        .catch(err => {
            btn.style.display = 'block';
            document.getElementById('loadingHO').style.display = 'none';
            alert('Terjadi kesalahan jaringan: ' + err.message);
        });
    }
</script>
