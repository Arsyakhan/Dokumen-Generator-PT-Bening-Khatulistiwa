<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WTP Commissioning Generator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-section { margin-bottom: 20px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 5px; background: #fafafa; }
        .form-section h3 { margin-top: 0; color: #34495e; font-size: 16px; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; }
        .checkbox-item { display: flex; align-items: center; width: 45%; }
        .checkbox-item input { margin-right: 10px; transform: scale(1.2); }
        button { width: 100%; padding: 12px; background: #2980b9; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #1c5980; }
        
        /* Area Tracking List */
        .tracking-area { margin-top: 30px; }
        .tracking-area h3 { border-bottom: 2px solid #27ae60; color: #27ae60; padding-bottom: 5px; }
        .doc-list { list-style: none; padding: 0; margin: 0; }
        .doc-list li { background: #e8f8f5; border: 1px solid #a3e4d7; margin-bottom: 10px; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .doc-list li a { text-decoration: none; background: #27ae60; color: white; padding: 8px 15px; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .doc-list li a:hover { background: #1e8449; }
        #loading { display: none; text-align: center; font-weight: bold; color: #d35400; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>WTP Commissioning Report Generator</h2>
    
    <form id="reportForm">
        <!-- Project Data -->
        <div class="form-section">
            <h3>1. Project Details</h3>
            <div class="input-group">
                <label>Project Name (Nama File)</label>
                <input type="text" id="project_name" required placeholder="Contoh: PLTU Jateng 2x1000MW">
            </div>
            <div class="input-group">
                <label>System Title (Judul di Dokumen)</label>
                <input type="text" id="system_title" required placeholder="Contoh: WATER TREATMENT PLANT 500 CMD">
            </div>
            <div class="input-group">
                <label>Company / Client Name</label>
                <input type="text" id="company_name" required>
            </div>
            <div class="input-group">
                <label>PO Number</label>
                <input type="text" id="po_number">
            </div>
            <div class="input-group">
                <label>Location of Plant (Kota/Kab)</label>
                <input type="text" id="location">
            </div>
            <div class="input-group">
                <label>Alamat Lengkap</label>
                <input type="text" id="alamat">
            </div>
        </div>

        <!-- System Configuration (Checkboxes) -->
        <div class="form-section">
            <h3>2. System Modules & Configuration</h3>
            <div class="checkbox-group">
                <div class="checkbox-item"><input type="checkbox" id="has_clarifier"> <label for="has_clarifier">Clarifier System</label></div>
                <div class="checkbox-item"><input type="checkbox" id="has_dosing"> <label for="has_dosing">Dosing Pump</label></div>
                <div class="checkbox-item"><input type="checkbox" id="has_birm"> <label for="has_birm">Birm Iron Filter</label></div>
                <div class="checkbox-item"><input type="checkbox" id="has_mmf"> <label for="has_mmf">Multi Media Filter (MMF)</label></div>
                <div class="checkbox-item"><input type="checkbox" id="has_acf"> <label for="has_acf">Activated Carbon Filter (ACF)</label></div>
                <div class="checkbox-item"><input type="checkbox" id="has_softener"> <label for="has_softener">Softener</label></div>
                <div class="checkbox-item"><input type="checkbox" id="has_uf"> <label for="has_uf">Ultra Filtration (UF)</label></div>
                <div class="checkbox-item"><input type="checkbox" id="has_mixedbed"> <label for="has_mixedbed">Mixed Bed</label></div>
                <div class="checkbox-item" style="width:100%; border-top: 1px solid #ccc; padding-top:10px; margin-top:10px;">
                    <input type="checkbox" id="has_ro"> <label for="has_ro" style="font-weight:bold; color:#d35400;">Reverse Osmosis (RO)</label>
                </div>
                <div class="checkbox-item" style="margin-left: 20px;"><input type="checkbox" id="is_ro_large"> <label for="is_ro_large">Include Backpressure (RO Besar)</label></div>
                <div class="checkbox-item" style="margin-left: 20px;"><input type="checkbox" id="has_recycle"> <label for="has_recycle">Include Flow Recycle</label></div>
            </div>
        </div>

        <!-- Signatures -->
        <div class="form-section">
            <h3>3. Signatories</h3>
            <div class="input-group">
                <label>Owner Company Name</label>
                <input type="text" id="owner_company">
            </div>
            <div class="input-group">
                <label>Owner Authorized Personnel</label>
                <input type="text" id="owner_name">
            </div>
            <div class="input-group">
                <label>Contractor Authorized Personnel</label>
                <input type="text" id="contractor_name">
            </div>
        </div>

        <button type="button" onclick="generateReport()">Generate Commissioning Report</button>
        <div id="loading">Memproses dokumen di server Google... Mohon tunggu.</div>
    </form>

    <!-- Tracking List Area -->
    <div class="tracking-area" id="trackingArea" style="display: none;">
        <h3>Dokumen Tersimpan (Generated Documents)</h3>
        <ul class="doc-list" id="docList">
            <!-- Dokumen yang baru digenerate akan muncul di sini -->
        </ul>
    </div>
</div>

<script>
    // FUNGSI PERAKIT CHECKLIST DINAMIS
    function buildChecklist() {
        let checklist = [
            "( ) Power supply to electrical panel properly installed.",
            "( ) Power supply properly joined to electrical Control panel.",
            "( ) Water drain nozzle properly joined to water drain line."
        ];
        
        if (document.getElementById('has_clarifier').checked) {
            checklist.push("( ) Inlet Transfer pump properly joined to Outlet Settlement Tank / Raw Water Line.");
        }
        if (document.getElementById('has_dosing').checked) {
            checklist.push("( ) Chemical Dosing line properly joined to main pipe.");
            checklist.push("( ) Dosing pump properly joined to Chemical Tank.");
        }
        if (document.getElementById('has_birm').checked) {
            checklist.push("( ) Inlet Birm Filter properly joined to feed line.");
            checklist.push("( ) Outlet Birm Filter properly joined to the next treatment stage.");
        }
        if (document.getElementById('has_mmf').checked) {
            checklist.push("( ) Inlet MMF properly joined to feed line.");
            checklist.push("( ) Outlet MMF properly joined to the next treatment stage.");
        }
        if (document.getElementById('has_acf').checked) {
            checklist.push("( ) Inlet ACF properly joined to feed line.");
            checklist.push("( ) Outlet ACF properly joined to the next treatment stage.");
        }
        if (document.getElementById('has_softener').checked) {
            checklist.push("( ) Softener brine line properly joined to Brine Tank.");
        }
        if (document.getElementById('has_uf').checked) {
            checklist.push("( ) Inlet UF Feed Water Pump properly joined to Feed Water Tank.");
            checklist.push("( ) Outlet UF properly joined to UF Permeate Tank.");
            checklist.push("( ) Outlet cleaning line UF properly joined to UF Cleaning Tank.");
            checklist.push("( ) Inlet UF Backwash pump properly joined to UF Product Tank.");
        }
        if (document.getElementById('has_ro').checked) {
            checklist.push("( ) Outlet product line RO properly joined to Product water tank and CIP tank.");
            checklist.push("( ) Outlet reject line RO properly joined to water drain line.");
            checklist.push("( ) Outlet Cleaning/Flushing Pump properly joined to Inlet Cartridge filter.");
        }
        if (document.getElementById('has_mixedbed').checked) {
            checklist.push("( ) HCl and NaOH chemicals already prepared necessarily.");
            checklist.push("( ) Chemical drain nozzle properly joined to chemical drain line.");
        }
        
        return checklist.join("\n");
    }

    // FUNGSI PENGIRIMAN DATA (AJAX)
    function generateReport() {
        const scriptURL = 'MASUKKAN_URL_WEB_APP_APPS_SCRIPT_DISINI'; 
        
        const data = {
            project_name: document.getElementById('project_name').value,
            system_title: document.getElementById('system_title').value,
            company_name: document.getElementById('company_name').value,
            po_number: document.getElementById('po_number').value,
            location: document.getElementById('location').value,
            alamat: document.getElementById('alamat').value,
            owner_company: document.getElementById('owner_company').value,
            owner_name: document.getElementById('owner_name').value,
            contractor_name: document.getElementById('contractor_name').value,
            
            has_clarifier: document.getElementById('has_clarifier').checked,
            has_dosing: document.getElementById('has_dosing').checked,
            has_birm: document.getElementById('has_birm').checked,
            has_mmf: document.getElementById('has_mmf').checked,
            has_acf: document.getElementById('has_acf').checked,
            has_softener: document.getElementById('has_softener').checked,
            has_uf: document.getElementById('has_uf').checked,
            has_ro: document.getElementById('has_ro').checked,
            is_ro_large: document.getElementById('is_ro_large').checked,
            has_recycle: document.getElementById('has_recycle').checked,
            has_mixedbed: document.getElementById('has_mixedbed').checked,
            
            checklist_items: buildChecklist()
        };
        
        document.getElementById('loading').style.display = 'block';
        
        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            document.getElementById('loading').style.display = 'none';
            if (result.status === 'success') {
                // Tampilkan Area Tracking & Tambahkan dokumen baru ke daftar
                document.getElementById('trackingArea').style.display = 'block';
                const docList = document.getElementById('docList');
                
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>📄 <strong>${result.fileName}</strong></span>
                    <a href="${result.documentUrl}" target="_blank">Buka Dokumen</a>
                `;
                docList.appendChild(li);
                
                alert('Dokumen berhasil digenerate dan disimpan di Google Drive!');
            } else {
                alert('Gagal membuat dokumen: ' + result.message);
            }
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            alert('Error: ' + error.message);
        });
    }
</script>

</body>
</html>
