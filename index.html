<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comm Report Generator - PT Bening Khatulistiwa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-blue-600 border-b pb-2">Generator Commissioning Report</h2>
        
        <form id="commForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold">Company Name:</label>
                    <input type="text" id="company_name" class="w-full border p-2 rounded" required placeholder="PT Tirta Kimia">
                </div>
                <div>
                    <label class="block font-semibold">PO Number:</label>
                    <input type="text" id="po_number" class="w-full border p-2 rounded" required>
                </div>
            </div>

            <div>
                <label class="block font-semibold">Location:</label>
                <input type="text" id="location" class="w-full border p-2 rounded" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 bg-blue-50 p-4 rounded border border-blue-200">
                <div>
                    <label class="flex items-center space-x-2 font-semibold cursor-pointer">
                        <input type="checkbox" id="has_ro" checked onchange="adjustTags()">
                        <span>Sistem Reverse Osmosis (RO)</span>
                    </label>
                </div>
                <div>
                    <label class="flex items-center space-x-2 font-semibold cursor-pointer">
                        <input type="checkbox" id="has_uf" onchange="adjustTags()">
                        <span>Sistem Ultra Filtrasi (UF)</span>
                    </label>
                </div>
                <div>
                    <label class="flex items-center space-x-2 font-semibold cursor-pointer">
                        <input type="checkbox" id="has_softener" onchange="adjustTags()">
                        <span>Sistem Softener</span>
                    </label>
                </div>
            </div>

            <!-- Form Tag P&ID RO -->
            <div id="ro_tags_container" class="bg-gray-50 p-4 rounded mt-2">
                <h3 class="font-bold mb-2">Tag P&ID Reverse Osmosis (Auto-Adjust)</h3>
                <div class="grid grid-cols-3 gap-2 text-sm">
                    <input type="text" id="tag_pi_01" class="border p-1" value="PI-01">
                    <input type="text" id="tag_pi_02" class="border p-1" value="PI-02">
                    <input type="text" id="tag_pi_03" class="border p-1" value="PI-03">
                    <input type="text" id="tag_pi_04" class="border p-1" value="PI-04">
                    <input type="text" id="tag_pi_05" class="border p-1" value="PI-05">
                    <input type="text" id="tag_pi_06" class="border p-1" value="PI-06">
                </div>
            </div>

            <!-- Form Tag P&ID UF -->
            <div id="uf_tags_container" class="bg-blue-100 p-4 rounded mt-2 hidden">
                <h3 class="font-bold mb-2">Tag P&ID Ultra Filtrasi (UF)</h3>
                <div class="grid grid-cols-3 gap-2 text-sm">
                    <div><label>PS UF Feed:</label><input type="text" id="tag_ps_uf_feed" class="w-full border p-1" value="PS-XX"></div>
                    <div><label>PS UF BW:</label><input type="text" id="tag_ps_uf_bw" class="w-full border p-1" value="PS-XX"></div>
                    <div><label>PI Inlet UF:</label><input type="text" id="tag_pi_uf_in" class="w-full border p-1" value="PI-XX"></div>
                    <div><label>PI Outlet UF:</label><input type="text" id="tag_pi_uf_out" class="w-full border p-1" value="PI-XX"></div>
                    <div><label>FI Product UF:</label><input type="text" id="tag_fi_uf" class="w-full border p-1" value="FI-XX"></div>
                </div>
            </div>

            <!-- Form Tag P&ID Softener -->
            <div id="softener_tags_container" class="bg-green-100 p-4 rounded mt-2 hidden">
                <h3 class="font-bold mb-2">Tag P&ID Softener</h3>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div><label>PI Inlet Softener:</label><input type="text" id="tag_pi_soft_in" class="w-full border p-1" value="PI-XX"></div>
                    <div><label>PI Outlet Softener:</label><input type="text" id="tag_pi_soft_out" class="w-full border p-1" value="PI-XX"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block font-semibold">Owner / Client Authorized Person:</label>
                    <input type="text" id="owner_name" class="w-full border p-2 rounded" required>
                </div>
                <div>
                    <label class="block font-semibold">Contractor (Engineer PT Bening):</label>
                    <input type="text" id="contractor_name" class="w-full border p-2 rounded" value="Syafiq Khanafi Arifin">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
                Generate Dokumen
            </button>
        </form>

        <div id="result" class="mt-6 text-center text-lg font-semibold hidden flex flex-col items-center"></div>
    </div>

    <script>
        // Data Checklist Kombinasi
        const roOnlyList = "(   ) Power supply properly joined to electrical Control panel.\n(   ) Inlet raw water line properly joined to Inlet RO.\n(   ) Outlet product line RO properly joined to Product water storage tank.\n(   ) Outlet reject line RO properly joined to water drain line.";
        const ufRoList = "(   ) Inlet raw water line properly joined to UF Feed Pump.\n(   ) Outlet UF Permeate properly joined to RO Feed Pump.\n(   ) Outlet product RO properly joined to Product tank.\n(   ) Outlet reject RO properly joined to drain line."; 
        const softenerRoList = "(   ) Inlet raw water properly joined to Softener.\n(   ) Outlet Softener properly joined to RO Feed Pump.\n(   ) Brine tank joined to Softener injection line.\n(   ) Outlet product RO properly joined to Product tank.";
        const ufOnlyList = "(   ) Inlet raw water line properly joined to UF Feed Pump.\n(   ) Outlet UF Feed Pump properly joined to inlet UF.\n(   ) Outlet product UF properly joined to Product tank.\n(   ) Outlet backwash properly joined to drain line.";
        const softenerOnlyList = "(   ) Inlet raw water line properly joined to Softener Feed Pump.\n(   ) Outlet Softener properly joined to Product tank.\n(   ) Brine tank properly joined to Softener injection line.\n(   ) Drain line properly joined to open drain.";

        function adjustTags() {
            const hasRO = document.getElementById('has_ro').checked;
            const hasUF = document.getElementById('has_uf').checked;
            const hasSoftener = document.getElementById('has_softener').checked;
            
            // Sembunyikan/Tampilkan Form Tag
            document.getElementById('ro_tags_container').classList.toggle('hidden', !hasRO);
            document.getElementById('uf_tags_container').classList.toggle('hidden', !hasUF);
            document.getElementById('softener_tags_container').classList.toggle('hidden', !hasSoftener);

            // Geser Tag RO (hanya jika ada RO dan UF)
            if (hasRO && hasUF) {
                document.getElementById('tag_pi_01').value = 'PI-05'; document.getElementById('tag_pi_02').value = 'PI-06';
                document.getElementById('tag_pi_03').value = 'PI-07'; document.getElementById('tag_pi_04').value = 'PI-08';
                document.getElementById('tag_pi_05').value = 'PI-09'; document.getElementById('tag_pi_06').value = 'PI-10';
            } else {
                document.getElementById('tag_pi_01').value = 'PI-01'; document.getElementById('tag_pi_02').value = 'PI-02';
                document.getElementById('tag_pi_03').value = 'PI-03'; document.getElementById('tag_pi_04').value = 'PI-04';
                document.getElementById('tag_pi_05').value = 'PI-05'; document.getElementById('tag_pi_06').value = 'PI-06';
            }
        }

        document.getElementById('commForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resDiv = document.getElementById('result');
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = "<p class='text-blue-600'>⏳ Membuat dokumen... Mohon tunggu sekitar 5 detik.</p>";

            const hasRO = document.getElementById('has_ro').checked;
            const hasUF = document.getElementById('has_uf').checked;
            const hasSoftener = document.getElementById('has_softener').checked;
            
            // Penentuan Checklist Pintar
            let activeChecklist = "(   ) Checklist belum didefinisikan.";
            if (hasUF && !hasRO && !hasSoftener) activeChecklist = ufOnlyList;
            else if (hasSoftener && !hasRO && !hasUF) activeChecklist = softenerOnlyList;
            else if (hasUF && hasRO) activeChecklist = ufRoList;
            else if (hasSoftener && hasRO) activeChecklist = softenerRoList;
            else if (hasRO) activeChecklist = roOnlyList;
            
            if (!hasRO && !hasUF && !hasSoftener) {
                resDiv.innerHTML = "<p class='text-red-600'>Mohon centang minimal satu jenis sistem (RO, UF, atau Softener).</p>";
                return;
            }

            const payload = {
                company_name: document.getElementById('company_name').value,
                po_number: document.getElementById('po_number').value,
                location: document.getElementById('location').value,
                owner_company: document.getElementById('company_name').value,
                owner_name: document.getElementById('owner_name').value,
                contractor_name: document.getElementById('contractor_name').value,
                has_ro: hasRO,
                has_uf: hasUF,
                has_softener: hasSoftener,
                checklist_items: activeChecklist,
                
                tag_pi_01: document.getElementById('tag_pi_01').value,
                tag_pi_02: document.getElementById('tag_pi_02').value,
                tag_pi_03: document.getElementById('tag_pi_03').value,
                tag_pi_04: document.getElementById('tag_pi_04').value,
                tag_pi_05: document.getElementById('tag_pi_05').value,
                tag_pi_06: document.getElementById('tag_pi_06').value,
                tag_fi_01: "FI-01", tag_fi_02: "FI-02",

                tag_ps_uf_feed: document.getElementById('tag_ps_uf_feed').value,
                tag_ps_uf_bw: document.getElementById('tag_ps_uf_bw').value,
                tag_pi_uf_in: document.getElementById('tag_pi_uf_in').value,
                tag_pi_uf_out: document.getElementById('tag_pi_uf_out').value,
                tag_fi_uf: document.getElementById('tag_fi_uf').value,
                tag_pi_soft_in: document.getElementById('tag_pi_soft_in').value,
                tag_pi_soft_out: document.getElementById('tag_pi_soft_out').value
            };

            const scriptUrl = 'https://script.google.com/macros/s/AKfycbwjZ-4lOmSdhfI-eoreyOqyA0PqA_CTw5ZHr5itfEnMj862AxGhSBNqw8rDiF7X67vA3A/exec'; 
            
            try {
                const response = await fetch(scriptUrl, { method: 'POST', body: JSON.stringify(payload) });
                const data = await response.json();
                
                if(data.status === 'success') {
                    const wordDownloadUrl = `https://docs.google.com/document/d/${data.documentId}/export?format=docx`;
                    resDiv.innerHTML = `
                        <p class='text-green-600 mb-4'>✅ Dokumen Berhasil Dibuat!</p>
                        <a href="${wordDownloadUrl}" class="bg-green-600 text-white font-bold py-3 px-6 rounded shadow-md hover:bg-green-700 transition w-full max-w-sm block text-center">
                            📥 Download File MS Word (.docx)
                        </a>
                        <a href="${data.documentUrl}" target="_blank" class="mt-4 text-sm underline text-blue-700 block">
                            Atau pratinjau di Google Docs
                        </a>
                    `;
                } else {
                    resDiv.innerHTML = "<p class='text-red-600'>Error: " + data.message + "</p>";
                }
            } catch (err) {
                resDiv.innerHTML = "<p class='text-red-600'>Gagal menghubungi server.</p>";
            }
        });
    </script>
</body>
</html>
